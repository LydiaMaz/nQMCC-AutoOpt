# s-shell nuclei (H3, He3, He4): no spatial-symmetry blocks, one phase.
# step = max(rel*|value|, abs)

[scan]
ESEP_factor = [0.9, 1.0, 1.1]   # multiplies the starting deck's ESEP

[groups.main]
ESEP  = { rel = 0.5 }
ETA   = { abs = 0.0065 }
ZETA  = { rel = 0.25 }
FSCAL = { rel = 0.25 }
AC    = { rel = 0.25 }
AA    = { rel = 0.25 }
AR    = { rel = 0.25 }
ALPHA = { rel = 0.25 }
BETA  = { rel = 0.25 }
"Q*"  = { rel = 0.25 }          # every Q key the deck has

[groups.threebody]
DELTA   = { abs = 0.15 }
EPSILON = { abs = 0.15 }
THETA   = { abs = 0.15 }
UPSILON = { abs = 0.15 }
RSCAL   = { abs = 0.15 }
USCAL   = { abs = 0.15 }

[[phase]]
name   = "p0_main"
params = ["main", "threebody"]
